<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Apartments For Us — map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { height: 100%; margin: 0; font-family: -apple-system, system-ui, sans-serif; }
  #app { display: flex; height: 100%; }
  #mapwrap { flex: 1; position: relative; min-width: 0; }
  #map { position: absolute; inset: 0; }
  .legend { background: rgba(255,255,255,.94); padding: 8px 12px; border-radius: 8px;
            box-shadow: 0 1px 5px rgba(0,0,0,.3); font-size: 13px; line-height: 1.7; }
  .legend .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%;
                 margin-right: 6px; vertical-align: -1px; border: 2px solid transparent; }
  .legend .sq { border-radius: 3px; opacity: .45; }
  .legend .hollow { background: transparent !important; }
  .legend a { color: #2b6cb0; }
  .legend label { display: block; cursor: pointer; }
  .legend hr { border: none; border-top: 1px solid #ddd; margin: 5px 0; }
  .legend .muted { color: #666; }
  .legend .scalebar { height: 10px; border-radius: 5px; margin: 4px 0 1px; }
  .legend .scalelabels { display: flex; justify-content: space-between;
                         font-size: 11px; color: #666; margin-bottom: 2px;
                         font-variant-numeric: tabular-nums; }
  .noisescale { display: flex; gap: 1px; font-size: 10px; color: #555;
                margin: 1px 0 3px 17px; line-height: 1.2; }
  .noisescale span { display: flex; flex-direction: column; align-items: center; }
  .noisescale i { display: block; width: 20px; height: 8px; opacity: .7;
                  margin-bottom: 1px; }
  .noisescale .muted { justify-content: flex-end; color: #999; }
  .zonelabel { background: none; border: none; box-shadow: none;
               font-size: 12px; font-weight: 700; letter-spacing: .08em;
               text-transform: uppercase;
               text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 4px #fff; }
  .zonelabel::before { display: none; }

  /* ---- browse panel ---- */
  #side { width: 400px; display: flex; flex-direction: column;
          background: #fff; border-left: 1px solid #ddd; }
  body.nolist #side { display: none; }
  #sidehead { display: flex; gap: 6px; align-items: center; padding: 8px;
              border-bottom: 1px solid #e2e2e2; }
  #search { flex: 1; min-width: 0; padding: 6px 9px; font-size: 13px;
            border: 1px solid #ccc; border-radius: 7px; }
  #sort { padding: 5px 4px; font-size: 12px; border: 1px solid #ccc;
          border-radius: 7px; background: #fff; max-width: 110px; }
  #hidelist { border: 1px solid #ccc; background: #fff; border-radius: 7px;
              padding: 5px 8px; font-size: 13px; cursor: pointer; }
  #count { padding: 4px 10px 6px; font-size: 12px; color: #666; }
  #cards { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  #showlist { display: none; position: absolute; bottom: 26px; right: 10px;
              z-index: 1000; border: none; background: #fff; border-radius: 8px;
              box-shadow: 0 1px 5px rgba(0,0,0,.4); padding: 8px 12px;
              font-size: 13px; font-weight: 600; cursor: pointer; }
  body.nolist #showlist { display: block; }
  .card { display: flex; gap: 10px; padding: 8px; margin-bottom: 8px;
          border: 1px solid #e4e4e4; border-radius: 10px; cursor: pointer;
          background: #fff; }
  .card[hidden] { display: none; }  /* display:flex beats the hidden attr */
  .card:hover { border-color: #2b6cb0; box-shadow: 0 1px 6px rgba(43,108,176,.25); }
  .thumb { width: 104px; height: 82px; flex: none; border-radius: 7px;
           object-fit: cover; background: #eef2f6; position: relative; }
  .thumb.empty { display: flex; align-items: center; justify-content: center;
                 font-size: 26px; color: #b6c2cf;
                 background: linear-gradient(140deg, #eef2f6, #dde5ec); }
  .thumbwrap { position: relative; flex: none; }
  .photocount { position: absolute; right: 4px; bottom: 4px; background: rgba(0,0,0,.62);
                color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 8px; }
  .cardbody { min-width: 0; flex: 1; font-size: 12.5px; line-height: 1.45; }
  .cardtop { display: flex; align-items: baseline; gap: 8px; }
  .cardtop .price { font-size: 15.5px; font-weight: 700; }
  .chip { font-size: 11px; padding: 1px 8px; border-radius: 9px; color: #fff;
          white-space: nowrap; }
  .cardname { font-weight: 600; overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; }
  .cardmeta, .cardsub { color: #555; overflow: hidden; text-overflow: ellipsis;
                        white-space: nowrap; }

  /* ---- detail overlay ---- */
  #detail { position: fixed; inset: 0; z-index: 2000; background: rgba(15,20,28,.62);
            display: flex; align-items: center; justify-content: center; }
  #detail[hidden] { display: none; }
  #detailbox { background: #fff; width: min(960px, 94vw); max-height: 93vh;
               border-radius: 14px; display: flex; flex-direction: column;
               overflow: hidden; box-shadow: 0 12px 50px rgba(0,0,0,.45);
               position: relative; /* anchors #dclose to the box, not the viewport */ }
  #gallery { background: #14181d; position: relative; flex: none; }
  #gallery[hidden] { display: none; }
  #gmain { height: min(46vh, 430px); display: flex; align-items: center;
           justify-content: center; }
  #gimg { max-width: 100%; max-height: 100%; object-fit: contain; }
  .gnav { position: absolute; top: 0; bottom: 0; width: 64px; border: none;
          background: none; color: #fff; font-size: 34px; cursor: pointer;
          opacity: .75; text-shadow: 0 1px 6px rgba(0,0,0,.8); }
  .gnav:hover { opacity: 1; background: linear-gradient(90deg, rgba(0,0,0,.25), transparent); }
  #gprev { left: 0; } #gnext { right: 0; transform: scaleX(-1); }
  #gcount { position: absolute; right: 10px; top: 8px; color: #fff; font-size: 12px;
            background: rgba(0,0,0,.55); padding: 2px 9px; border-radius: 10px; }
  #gthumbs { display: flex; gap: 5px; overflow-x: auto; padding: 6px;
             background: #1d232b; }
  #gthumbs img { height: 52px; border-radius: 5px; cursor: pointer; opacity: .55;
                 flex: none; }
  #gthumbs img.on { opacity: 1; outline: 2px solid #6cb2ff; }
  #dclose { position: absolute; top: 8px; left: 8px; z-index: 5; border: none;
            background: rgba(0,0,0,.55); color: #fff; font-size: 16px;
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }
  #detailbox.nophotos #dclose { background: #eee; color: #333; }
  #dinfo { overflow-y: auto; padding: 16px 20px 20px; position: relative;
           font-size: 13.5px; line-height: 1.5; }
  #dhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  #dhead .price { font-size: 22px; font-weight: 800; }
  #dname { font-size: 15px; font-weight: 650; margin: 4px 0 10px; }
  #dname a { color: #1a4f8b; text-decoration: none; }
  #dname a:hover { text-decoration: underline; }
  #dfields { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
             gap: 6px 16px; margin: 0 0 12px; padding: 10px 12px;
             background: #f5f7fa; border-radius: 9px; }
  #dfields div b { display: block; font-size: 11px; color: #778;
                   text-transform: uppercase; letter-spacing: .04em; }
  #ddesc { white-space: pre-wrap; overflow-wrap: break-word; }
  #ddesc.empty { color: #888; font-style: italic; }
  #dmisc { color: #777; font-size: 12px; margin-top: 10px; }
  #dlinks { margin-top: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
  #dlinks a { color: #2b6cb0; font-weight: 600; text-decoration: none; }
  .approxnote { color: #b7791f; font-size: 12.5px; margin-top: 8px; }

  @media (max-width: 760px) {
    #app { flex-direction: column; }
    #side { width: auto; height: 46%; border-left: none; border-top: 1px solid #ddd; }
    #detailbox { width: 100vw; max-height: 100vh; height: 100vh; border-radius: 0; }
    #gmain { height: 34vh; }
    .legend { max-height: 45vh; overflow-y: auto; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="mapwrap">
    <div id="map"></div>
    <button id="showlist">☰ listings</button>
  </div>
  <aside id="side">
    <div id="sidehead">
      <input id="search" type="search" placeholder="Search price, street, description…">
      <select id="sort">
        <option value="order">newest</option>
        <option value="price">price ↑</option>
        <option value="ppsf">$/sq ft ↑</option>
        <option value="sqft">sq ft ↓</option>
        <option value="beds">beds ↓</option>
        <option value="walk">walk ↑</option>
      </select>
      <button id="hidelist" title="Hide the list">✕</button>
    </div>
    <div id="count"></div>
    <div id="cards"></div>
  </aside>
</div>

<div id="detail" hidden>
  <div id="detailbox">
    <button id="dclose" title="Close (Esc)">✕</button>
    <div id="gallery">
      <div id="gmain"><img id="gimg" alt="listing photo"></div>
      <button class="gnav" id="gprev">❮</button>
      <button class="gnav" id="gnext">❮</button>
      <span id="gcount"></span>
      <div id="gthumbs"></div>
    </div>
    <div id="dinfo">
      <div id="dhead"></div>
      <div id="dname"></div>
      <div id="dfields"></div>
      <div id="ddesc"></div>
      <div id="dmisc"></div>
      <div id="dlinks"></div>
    </div>
  </div>
</div>

ace, this yard is a true extension of the home. \nSpeaking of fury companions, dogs and cats are welcome here. This is a pet-friendly home in every sense. \nThe apartment is wired for high-speed internet, so whether you work from home or just demand a reliable connection, you're all set. Shared laundry is available in the basement, adding everyday convenience without leaving the building. \nGetting around couldn't be easier. The Orange Line is close by, and multiple MBTA bus routes put you minutes from the Longwood Medical Area, Downtown Boston, Back Bay, and beyond. Whether you're commuting to work or heading out for the evening, you'll appreciate how connected this location truly is. \nAnd the neighborhood? You couldn't ask for a better spot. Drawdown Brewery and the VU Cafe are literally a two-minute walk away, and the Brewery Complex one of JP's most beloved gathering spots is just five minutes on foot. A short stroll brings you to the beautiful Franklin Park, one of Boston's great green spaces, and the Franklin Park Zoo. Brookside puts you right in the heart of everything Jamaica Plain has to offer an eclectic mix of independent restaurants, coffee shops, and boutiques along Centre Street and South Street. Weekend mornings bring the Farmers Market; afternoons invite strolls around Jamaica Pond or through the Arnold Arboretum. This is the kind of neighborhood people don't leave easily. \nOwner-occupied and well-maintained, this triple decker is a home with pride of ownership neighbors who care about the building and the community around it. \nThe Details: \nRent: $3,000/month \nAvailable: September 1, 2026 \nWater & sewer included \nTenant pays electric, gas and internet \nWired for Verizon FIOS high-speed internet \nShared laundry in basement $4/load \nShared access to back porch, patio and yard \nCats and dogs welcome \nNo realtor fee \nFirst month's rent and security deposit required \nNo smoking \nShown by appointment only:\n[available sep 1]", "photos": ["2 const RAMP = ["#86b6ef","#6da7ec","#5598e7","#3987e5","#2a78d6",

const RANK_ORDER = ["great", "good-great", "good", "good-okay", "okay", "no"];

const ppsfVals = markers.map(m => m.ppsf).filter(v => v != null);
const ppsfMin = Math.min(...ppsfVals), ppsfMax = Math.max(...ppsfVals);

const lerpHex = (a, b, t) => {
  const h = x => [1, 3, 5].map(i => parseInt(x.slice(i, i + 2), 16));
  const [r1, g1, b1] = h(a), [r2, g2, b2] = h(b);
  return "#" + [r1 + (r2 - r1) * t, g1 + (g2 - g1) * t, b1 + (b2 - b1) * t]
    .map(v => Math.round(v).toString(16).padStart(2, "0")).join("");
};
function rampColor(t) {  // t in 0..1 → piecewise-linear along RAMP
  t = Math.max(0, Math.min(1, t)) * (RAMP.length - 1);
  const i = Math.min(Math.floor(t), RAMP.length - 2);
  return lerpHex(RAMP[i], RAMP[i + 1], t - i);
}

function dotColor(m, mode) {
  if (mode === "ppsf")
    return m.ppsf == null ? NODATA
      : rampColor((ppsfMax - m.ppsf) / (ppsfMax - ppsfMin || 1));

    return rankColor(m);

}

                set(v) { try { localStorage.setItem("aptColorMode", v); } catch {} } };
let colorMode = store.get() || "status";

markers.forEach((m, i) => {

    radius: 9, color: c, weight: 2.5,

// Fit everything: apartments plus the full extent of the search zones.
const bounds = L.latLngBounds(markers.map(m => [m.lat, m.lon]));
for (const a of anchors) {
  const dlat = a.miles / 69, dlon = a.miles / (69 * Math.cos(a.lat * Math.PI / 180));
  bounds.extend([a.lat - dlat, a.lon - dlon]);
  bounds.extend([a.lat + dlat, a.lon + dlon]);
}
const fitAll = () => { map.invalidateSize(); map.fitBounds(bounds, { padding: [30, 30] }); };
fitAll();

// fit to max zoom (seen in embedded webviews) — refit once it really has one.
if (!map.getSize().y) {
  const ro = new ResizeObserver(() => {
    map.invalidateSize();
    if (map.getSize().y) { ro.disconnect(); fitAll(); }
  });
  ro.observe(document.getElementById("map"));
}

// Legend: status toggles, color-by picker + key, notes.
function keyHtml(mode) {
  if (mode === "ppsf") {
    if (!ppsfVals.length) return `<span class="muted">no sq ft data yet</span>`;
    return `<div class="scalebar" style="background:linear-gradient(90deg,${[...RAMP].reverse().join(",")})"></div>` +
      `<div class="scalelabels"><span>$${ppsfMin.toFixed(2)}</span>` +
      `<span>$ / sq ft</span><span>$${ppsfMax.toFixed(2)}</span></div>` +
      `<span class="dot" style="background:${NODATA}"></span>` +
      `<span class="muted">no sq ft known</span>`;
  }
  if (mode === "rank") {
    const counts = {};
    for (const m of markers) {
      const r = m.rank.trim().toLowerCase();
      counts[r] = (counts[r] || 0) + 1;
    }
    let h = "";
    for (const r of [...RANK_ORDER, "expired"])
      if (counts[r]) h += `<span class="dot" style="background:${RANK_COLORS[r]}"></span>` +
                          `${esc(r)} (${counts[r]})<br>`;
    const unranked = markers.length -
      Object.entries(counts).reduce((s, [r, n]) => s + (RANK_COLORS[r] ? n : 0), 0);
    if (unranked) h += `<span class="dot" style="background:${UNRANKED}"></span>` +
                       `<span class="muted">not ranked yet (${unranked})</span><br>`;
    return h;
  }
  return "";  // status: the filter swatches above are the key
}

function applyMode(mode, div) {
  colorMode = mode;
  store.set(mode);
  for (const [m, mk] of dots) {
    const c = dotColor(m, mode);
    mk.setStyle({ color: c, fillColor: c });
  }
  div.querySelector("#scalekey").innerHTML = keyHtml(mode);
  // In a non-status mode the dots no longer wear status colors — mute the
  // filter swatches so the only colored key on screen is the active scale.
  for (const el of div.querySelectorAll(".statusdot"))
    el.style.background = mode === "status" ? el.dataset.c : "#cbd5e0";
}

  h += `<span class="dot hollow" style="border-color:#666"></span>` +
       `<span class="muted" style="color:#666">hollow = approximate spot</span><br>` +
       `<a href="https://docs.google.com/spreadsheets/d/1tSarkMFIYAaXFP6Y3X-rpmb5NHumXJU_KsFfDtR3PYk/edit" target="_blank">open the sheet ↗</a><br>` +
       `<span style="color:#999;font-size:11px">updated Aug 13, 9:08 AM</span>`;
  div.innerHTML = h;
  div.addEventListener("change", e => {
    if (e.target.name === "colormode") return applyMode(e.target.value, div);
    if (e.target.dataset.transit)
      return e.target.checked ? transitGroup.addTo(map) : transitGroup.remove();
    if (e.target.dataset.bike)
      return e.target.checked ? bikeLayer.addTo(map) : bikeLayer.remove();
    if (e.target.dataset.noise) {
      div.querySelector(".noisescale").hidden = !e.target.checked;
      return e.target.checked ? noiseLayer.addTo(map) : noiseLayer.remove();
    }
    if (e.target.dataset.zones) {
      for (const z of Object.values(zones))
        e.target.checked ? z.group.addTo(map) : z.group.remove();
      return;
    }
    const s = byStatus[e.target.dataset.status];
    if (s) e.target.checked ? s.group.addTo(map) : s.group.remove();
    if (e.target.dataset.status) applyFilters();  // keep the card list in sync
  });
  L.DomEvent.disableClickPropagation(div);
  legendDiv = div;
  applyMode(colorMode, div);
  return div;
};
legend.addTo(map);

// ================= browse panel: cards + search + sort =================
const $ = id => document.getElementById(id);
const num = v => { const n = parseFloat(String(v ?? "").replace(/[$,]/g, ""));
                   return isNaN(n) ? null : n; };

function metaLine(m) {
  return [m.beds && `${esc(m.beds)} bd`, m.baths && `${esc(m.baths)} ba`,
          m.sqft && `${esc(m.sqft)} sq ft`,
          m.ppsf != null && `$${m.ppsf.toFixed(2)}/sf`]
         .filter(Boolean).join(" · ");
}

const gmapsUrl = addr =>
  `https://www.google.com/maps/search/${encodeURIComponent(addr)}`;
const chipsHtml = (m, rankPrefix = "") =>
  `<span class="chip" style="background:${m.color}">${esc(m.status)}</span>` +
  (m.rank ? `<span class="chip" style="background:${rankColor(m)}">${rankPrefix}${esc(m.rank)}</span>` : "");

const cardEls = [];
function buildCards() {
  const box = $("cards");
  markers.forEach((m, i) => {
    const el = document.createElement("div");
    el.className = "card";
    const thumb = m.photos.length
      ? `<img class="thumb" loading="lazy" src="${esc(IMGBASE + (m.thumb || m.photos[0]))}" alt="">` +
        (m.photos.length > 1 ? `<span class="photocount">📷 ${m.photos.length}</span>` : "")
      : `<div class="thumb empty">🏠</div>`;
    const sub = [m.station && esc(m.station) + (m.walk ? ` · ${esc(m.walk)} min` : ""),
                 m.avail && `avail ${esc(m.avail)}`].filter(Boolean).join(" · ");
    el.innerHTML =
      `<div class="thumbwrap">${thumb}</div>` +
      `<div class="cardbody">` +
        `<div class="cardtop"><span class="price">${m.price ? "$" + esc(m.price) : "$?"}</span>` +
          chipsHtml(m) +
        `</div>` +
        `<div class="cardmeta">${metaLine(m) || "&nbsp;"}</div>` +
        `<div class="cardname">${esc(m.name) || "listing"}</div>` +
        `<div class="cardsub">${sub || esc(m.addr) || "&nbsp;"}</div>` +
      `</div>`;
    el.addEventListener("click", () => {
      map.setView([m.lat, m.lon], Math.max(map.getZoom(), 15));
      openDetail(i);
    });
    el.addEventListener("mouseenter", () => dots[i][1].setStyle({ weight: 5 }).setRadius(11));
    el.addEventListener("mouseleave", () => dots[i][1].setStyle({ weight: 2.5 }).setRadius(9));
    box.appendChild(el);
    cardEls.push(el);
  });
}
buildCards();

// The price appears both as written ("2,900") and comma-less ("2900") so
// either way of typing it matches.
const hay = markers.map(m =>
  [m.price, String(m.price).replace(/,/g, ""), m.name, m.addr, m.desc,
   m.station, m.status, m.rank, m.misc,
   m.avail, m.lease, m.laundry].join(" ").toLowerCase());

function activeStatuses() {
  if (!legendDiv) return new Set(Object.keys(byStatus));
  return new Set([...legendDiv.querySelectorAll("input[data-status]")]
                 .filter(cb => cb.checked).map(cb => cb.dataset.status));
}

function applyFilters() {
  const q = $("search").value.trim().toLowerCase();
  const on = activeStatuses();
  let shown = 0;
  markers.forEach((m, i) => {
    const ok = on.has(m.status) && (!q || hay[i].includes(q));
    cardEls[i].hidden = !ok;
    shown += ok;
    // Dim (don't remove) markers that don't match the search — removing
    // would fight the status layer-group toggles.
    const dim = q && !hay[i].includes(q);
    dots[i][1].setStyle({ opacity: dim ? 0.15 : 1,
                          fillOpacity: dim ? 0.06 : (m.approx ? 0.15 : 0.85) });
  });
  $("count").textContent = `${shown} of ${markers.length} listings` +
    (q ? ` matching “${q}”` : "");
}
$("search").addEventListener("input", applyFilters);

const SORTS = {
  order: (a, b) => b - a,   // sheet order, newest (bottom rows) first
  price: (a, b) => (num(markers[a].price) ?? 1e9) - (num(markers[b].price) ?? 1e9),
  ppsf:  (a, b) => (markers[a].ppsf ?? 1e9) - (markers[b].ppsf ?? 1e9),
  sqft:  (a, b) => (num(markers[b].sqft) ?? -1) - (num(markers[a].sqft) ?? -1),
  beds:  (a, b) => (num(markers[b].beds) ?? -1) - (num(markers[a].beds) ?? -1),
  walk:  (a, b) => (num(markers[a].walk) ?? 1e9) - (num(markers[b].walk) ?? 1e9),
};
function applySort() {
  const idx = markers.map((_, i) => i).sort(SORTS[$("sort").value] || SORTS.order);
  const box = $("cards");
  for (const i of idx) box.appendChild(cardEls[i]);  // appendChild moves = reorders
}
$("sort").addEventListener("change", applySort);
applySort();
applyFilters();

$("hidelist").addEventListener("click", () => {
  document.body.classList.add("nolist"); map.invalidateSize();
});
$("showlist").addEventListener("click", () => {
  document.body.classList.remove("nolist"); map.invalidateSize();
});
$("showlist").textContent = `☰ ${markers.length} listings`;

// ================= detail overlay + photo gallery =================
let cur = null, photoIdx = 0;

function field(label, value, html) {
  return value ? `<div><b>${label}</b>${html ?? esc(value)}</div>` : "";
}

function openDetail(i) {
  cur = i;
  const m = markers[i];
  dots[i][1].setStyle({ weight: 5 });

  const has = m.photos.length > 0;
  $("gallery").hidden = !has;
  $("detailbox").classList.toggle("nophotos", !has);
  if (has) {
    $("gthumbs").innerHTML = m.photos.map((p, j) =>
      `<img loading="lazy" src="${esc(IMGBASE + p)}" data-j="${j}" alt="">`).join("");
    showPhoto(0);
  }

  $("dhead").innerHTML =
    `<span class="price">${m.price ? "$" + esc(m.price) : "$?"}</span>` +
    chipsHtml(m, "Carly: ") +
    `<span style="color:#666">${metaLine(m)}</span>`;
  $("dname").innerHTML =
    `<a href="${esc(m.link)}" target="_blank">${esc(m.name) || "listing"} ↗</a>`;
  $("dfields").innerHTML =
    field("T station", m.station, esc(m.station) + (m.walk ? ` · ${esc(m.walk)} min walk` : "")) +
    field("Available", m.avail) +
    field("Lease", m.lease) +
    field("Floor", m.floor) +
    field("Laundry", m.laundry) +
    field("Yard", m.yard) +
    field("Balcony", m.balcony) +
    field("Address", m.addr,
          `<a target="_blank" href="${gmapsUrl(m.addr)}">${esc(m.addr)}</a>`);
  $("ddesc").textContent = m.desc ||
    "No description captured yet — open the listing for the full post.";
  $("ddesc").classList.toggle("empty", !m.desc);
  $("dmisc").textContent = m.misc || "";
  $("dlinks").innerHTML =
    `<a href="${esc(m.link)}" target="_blank">Open listing ↗</a>` +
    (m.addr ? `<a target="_blank" href="${gmapsUrl(m.addr)}">Google Maps ↗</a>` : "") +
    `<a href="https://docs.google.com/spreadsheets/d/1tSarkMFIYAaXFP6Y3X-rpmb5NHumXJU_KsFfDtR3PYk/edit" target="_blank">Sheet ↗</a>` +
    (m.approx ? `<span class="approxnote">⚠ no street address — placed near its T stop</span>` : "");
  $("detail").hidden = false;
  $("dinfo").scrollTop = 0;
}

function showPhoto(j) {
  const m = markers[cur];
  photoIdx = (j + m.photos.length) % m.photos.length;
  $("gimg").src = IMGBASE + m.photos[photoIdx];
  $("gcount").textContent = `${photoIdx + 1} / ${m.photos.length}`;
  const nav = m.photos.length > 1;
  $("gprev").style.display = $("gnext").style.display = nav ? "" : "none";
  for (const t of $("gthumbs").children) {
    t.classList.toggle("on", +t.dataset.j === photoIdx);
    if (+t.dataset.j === photoIdx) t.scrollIntoView({ block: "nearest", inline: "nearest" });
  }
}

function closeDetail() {
  if (cur != null) dots[cur][1].setStyle({ weight: 2.5 });
  $("detail").hidden = true;
  cur = null;
}

$("dclose").addEventListener("click", closeDetail);
$("detail").addEventListener("click", e => { if (e.target === $("detail")) closeDetail(); });
$("gprev").addEventListener("click", () => showPhoto(photoIdx - 1));
$("gnext").addEventListener("click", () => showPhoto(photoIdx + 1));
$("gthumbs").addEventListener("click", e => {
  if (e.target.dataset.j != null) showPhoto(+e.target.dataset.j);
});
document.addEventListener("keydown", e => {
  if (cur == null) return;
  if (e.key === "Escape") closeDetail();
  if (markers[cur].photos.length > 1) {
    if (e.key === "ArrowLeft") showPhoto(photoIdx - 1);
    if (e.key === "ArrowRight") showPhoto(photoIdx + 1);
  }
});
</script>
</body>
</html>
