    weight: 1, opacity: .25, fillOpacity: .04, interactive: false }).addTo(map);

const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function popupHtml(m) {
  const bits = [];
  if (m.price) bits.push(`<span class="price">$${esc(m.price)}</span>`);
  const bb = [m.beds && `${esc(m.beds)} bd`, m.baths && `${esc(m.baths)} ba`,
              m.sqft && `${esc(m.sqft)} sq ft`].filter(Boolean).join(" · ");
  if (bb) bits.push(bb);
  let h = `<div class="popup">` + bits.join(" &nbsp; ") + `<br>` +
    `<a class="name" href="${esc(m.link)}" target="_blank">${esc(m.name) || "listing"}</a><br>`;
  if (m.rank) h += `Carly rank: <b>${esc(m.rank)}</b><br>`;
  h += `<span class="muted">${esc(m.status)}`;
  if (m.avail) h += ` · avail ${esc(m.avail)}`;
  if (m.laundry) h += ` · laundry: ${esc(m.laundry)}`;
  h += `</span><br>`;
  if (m.station) h += `<span class="muted">${esc(m.station)}` +
    (m.walk ? ` · ${esc(m.walk)} min walk` : "") + `</span><br>`;
  if (m.addr) h += `<a class="muted" target="_blank" href="https://www.google.com/maps/search/` +
    `${encodeURIComponent(m.addr)}">${esc(m.addr)}</a><br>`;
  if (m.approx) h += `<span class="approx">⚠ no street address — placed near its T stop</span>`;
  return h + `</div>`;
}

// One toggleable layer group per status.
const byStatus = {};
for (const m of markers) {
  const mk = L.circleMarker([m.lat, m.lon], {
    radius: 9, color: m.color, weight: 2.5,
    fillColor: m.color, fillOpacity: m.approx ? 0.15 : 0.85,
    dashArray: m.approx ? "3 3" : null,
  }).bindPopup(popupHtml(m), { maxWidth: 280 })
    .bindTooltip(`$${m.price || "?"}`, { direction: "top", offset: [0, -8] });
  (byStatus[m.status] ??= { group: L.layerGroup().addTo(map), color: m.color, n: 0 });
  byStatus[m.status].group.addLayer(mk);
  byStatus[m.status].n++;
}

const all = markers.map(m => [m.lat, m.lon]);
if (all.length) map.fitBounds(all, { padding: [40, 40] }); else map.setView([42.39, -71.12], 12);

// Legend: status toggles + notes.
const legend = L.control({ position: "topright" });
legend.onAdd = () => {
  const div = L.DomUtil.create("div", "legend");
  let h = "";
  for (const [status, s] of Object.entries(byStatus))
    h += `<label><input type="checkbox" checked data-status="${esc(status)}">` +
         `<span class="dot" style="background:${s.color}"></span>${esc(status)} (${s.n})</label>`;
  h += `<span class="dot hollow" style="border-color:#666"></span>` +
       `<span class="muted" style="color:#666">hollow = approximate spot</span><br>` +
       `<a href="https://docs.google.com/spreadsheets/d/1tSarkMFIYAaXFP6Y3X-rpmb5NHumXJU_KsFfDtR3PYk/edit" target="_blank">open the sheet ↗</a><br>` +
       `<span style="color:#999;font-size:11px">updated Aug 13, 12:33 AM</span>`;
  div.innerHTML = h;
  div.addEventListener("change", e => {
    const s = byStatus[e.target.dataset.status];
    if (s) e.target.checked ? s.group.addTo(map) : s.group.remove();
  });
  L.DomEvent.disableClickPropagation(div);
  return div;
};
legend.addTo(map);
