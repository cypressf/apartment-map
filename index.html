const map = L.map("map");
// Base map, mostly desaturated so it doesn't compete with the colored
// overlays (noise, zones, dots). Nature keeps its color: green hues
// (parks/woods) and water blues pass through; everything else — road
// oranges, reds, yellows — is flattened to its gray luminance.
const NatureOnlyOSM = L.TileLayer.extend({
  createTile: function (coords, done) {
    const tile = document.createElement("canvas");
    tile.width = tile.height = 256;
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      const ctx = tile.getContext("2d");
      ctx.drawImage(img, 0, 0);
      const d = ctx.getImageData(0, 0, 256, 256);
      const p = d.data;
      for (let i = 0; i < p.length; i += 4) {
        const r = p[i], g = p[i + 1], b = p[i + 2];
        const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
        const sat = mx ? (mx - mn) / mx : 0;
        let hue = 0;
        if (mx !== mn) {
          if (mx === r) hue = 60 * (((g - b) / (mx - mn)) % 6);
          else if (mx === g) hue = 60 * ((b - r) / (mx - mn) + 2);
          else hue = 60 * ((r - g) / (mx - mn) + 4);
          if (hue < 0) hue += 360;
        }
        const nature = sat > 0.06 &&
          ((hue >= 80 && hue < 175) ||           // vegetation greens
           (hue >= 175 && hue <= 235));          // water blues
        if (!nature) {
          const y = 0.299 * r + 0.587 * g + 0.114 * b;
          p[i] = p[i + 1] = p[i + 2] = y;
        }
      }
      ctx.putImageData(d, 0, 0);
      done(null, tile);
    };
    img.onerror = e => done(e, tile);
    img.src = this.getTileUrl(coords);
    return tile;
  },
});
new NatureOnlyOSM("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(map);

// Noise overlay: US DOT/BTS National Transportation Noise Map (2022) —

// Quiet streets are transparent; colors start at 45 dB.
// Deliberately NOT the rail-inclusive service: the BTS rail model ignores
// terrain shielding and prices electric commuter rail as diesel, so it
// blankets the (trenched, mostly electric) JP Southwest Corridor in a
// half-mile-wide 60-80 dB smear that no independent source corroborates.
const noisePane = map.createPane("noise");

    attribution: "Noise: US DOT BTS 2022" }).addTo(map);
// dB class -> swatch color, straight from the service's legend endpoint.
const NOISE_SCALE = [["45", "#FFC107"], ["50", "#FF8000"], ["55", "#FF0000"],
                     ["60", "#FF3399"], ["70", "#A300CC"], ["80", "#5200CC"],
                     ["90+", "#0000FF"]];

// flat shape. Trick: the circles are fully opaque inside a dedicated pane,
// and the pane itself is faded with CSS — so overlaps don't double-darken.
const ZONE_COLORS = { "Camberville": "#DA291C",   // Red Line red
                      "JP (Green E)": "#00843D",  // Green Line green
                      "JP (SW Corridor)": "#ED8B00",  // Orange Line orange
                      "Minuteman": "#b45309" };   // bike-path amber

const zones = {};  // area label -> {group, color, pts}
for (const a of anchors) {
  const z = (zones[a.area] ??= { group: L.layerGroup().addTo(map), pts: [],
                                 color: ZONE_COLORS[a.area] || "#2b6cb0" });
  z.group.addLayer(L.circle([a.lat, a.lon], { pane: "zones",
    radius: a.miles * 1609, stroke: false, fillColor: z.color, fillOpacity: 1 }));

for (const [area, z] of Object.entries(zones)) {
  const lat = z.pts.reduce((s, p) => s + p[0], 0) / z.pts.length;
  const lon = z.pts.reduce((s, p) => s + p[1], 0) / z.pts.length;

}

const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---- dot color modes: status (sheet colors) / $ per sq ft / Carly rank ----
// Sequential blue ramp; $/sq ft runs dark→light so the best deals pop.
const RAMP = ["#86b6ef","#6da7ec","#5598e7","#3987e5","#2a78d6",
              "#256abf","#1c5cab","#184f95","#104281","#0d366b"];
const NODATA = "#a0aec0";
// Carly's scale is ordinal text; same blue ramp (dark = better), red = "no".
const RANK_COLORS = { "great": "#0d366b", "good-great": "#184f95",
                      "good": "#256abf", "good-okay": "#3987e5",
                      "okay": "#86b6ef", "no": "#e34948", "expired": NODATA };
const RANK_ORDER = ["great", "good-great", "good", "good-okay", "okay", "no"];
const UNRANKED = "#cbd5e0";

const ppsfVals = markers.map(m => m.ppsf).filter(v => v != null);
const ppsfMin = Math.min(...ppsfVals), ppsfMax = Math.max(...ppsfVals);

const lerpHex = (a, b, t) => {
  const h = x => [1, 3, 5].map(i => parseInt(x.slice(i, i + 2), 16));
  const [r1, g1, b1] = h(a), [r2, g2, b2] = h(b);
  return "#" + [r1 + (r2 - r1) * t, g1 + (g2 - g1) * t, b1 + (b2 - b1) * t]
    .map(v => Math.round(v).toString(16).padStart(2, "0")).join("");
};
function rampColor(t) {  // t in 0..1 → piecewise-linear along RAMP
  t = Math.max(0, Math.min(1, t)) * (RAMP.length - 1);
  const i = Math.min(Math.floor(t), RAMP.length - 2);
  return lerpHex(RAMP[i], RAMP[i + 1], t - i);
}
function dotColor(m, mode) {
  if (mode === "ppsf")
    return m.ppsf == null ? NODATA
      : rampColor((ppsfMax - m.ppsf) / (ppsfMax - ppsfMin || 1));
  if (mode === "rank")
    return RANK_COLORS[m.rank.trim().toLowerCase()] ?? UNRANKED;
  return m.color;  // status
}

function popupHtml(m) {
  const bits = [];
  if (m.price) bits.push(`<span class="price">$${esc(m.price)}</span>`);
  const bb = [m.beds && `${esc(m.beds)} bd`, m.baths && `${esc(m.baths)} ba`,
              m.sqft && `${esc(m.sqft)} sq ft`,
              m.ppsf != null && `$${m.ppsf.toFixed(2)}/sq ft`]
             .filter(Boolean).join(" · ");
  if (bb) bits.push(bb);
  let h = `<div class="popup">` + bits.join(" &nbsp; ") + `<br>` +
    `<a class="name" href="${esc(m.link)}" target="_blank">${esc(m.name) || "listing"}</a><br>`;
  if (m.rank) h += `Carly rank: <b>${esc(m.rank)}</b><br>`;
  h += `<span class="muted">${esc(m.status)}`;
  if (m.avail) h += ` · avail ${esc(m.avail)}`;
  if (m.laundry) h += ` · laundry: ${esc(m.laundry)}`;
  h += `</span><br>`;
  if (m.station) h += `<span class="muted">${esc(m.station)}` +
    (m.walk ? ` · ${esc(m.walk)} min walk` : "") + `</span><br>`;
  if (m.addr) h += `<a class="muted" target="_blank" href="https://www.google.com/maps/search/` +
    `${encodeURIComponent(m.addr)}">${esc(m.addr)}</a><br>`;
  if (m.approx) h += `<span class="approx">⚠ no street address — placed near its T stop</span>`;
  return h + `</div>`;
}

// One toggleable layer group per status; dots kept for recoloring by mode.
const byStatus = {};
const dots = [];
// localStorage throws in sandboxed/private contexts — persistence is optional.
const store = { get() { try { return localStorage.getItem("aptColorMode"); } catch { return null; } },
                set(v) { try { localStorage.setItem("aptColorMode", v); } catch {} } };
let colorMode = store.get() || "status";

for (const m of markers) {
  const c = dotColor(m, colorMode);
  const mk = L.circleMarker([m.lat, m.lon], {
    radius: 9, color: c, weight: 2.5,
    fillColor: c, fillOpacity: m.approx ? 0.15 : 0.85,
    dashArray: m.approx ? "3 3" : null,
  }).bindPopup(popupHtml(m), { maxWidth: 280 })
    .bindTooltip(`$${m.price || "?"}`, { direction: "top", offset: [0, -8] });
  dots.push([m, mk]);
  (byStatus[m.status] ??= { group: L.layerGroup().addTo(map), color: m.color, n: 0 });
  byStatus[m.status].group.addLayer(mk);
  byStatus[m.status].n++;
}

// Fit everything: apartments plus the full extent of the search zones.
const bounds = L.latLngBounds(markers.map(m => [m.lat, m.lon]));
for (const a of anchors) {
  const dlat = a.miles / 69, dlon = a.miles / (69 * Math.cos(a.lat * Math.PI / 180));
  bounds.extend([a.lat - dlat, a.lon - dlon]);
  bounds.extend([a.lat + dlat, a.lon + dlon]);
}
const fitAll = () => { map.invalidateSize(); map.fitBounds(bounds, { padding: [30, 30] }); };
fitAll();
// A container that hasn't been laid out yet has zero size, which clamps the
// fit to max zoom (seen in embedded webviews) — refit once it really has one.
if (!map.getSize().y) {
  const ro = new ResizeObserver(() => {
    map.invalidateSize();
    if (map.getSize().y) { ro.disconnect(); fitAll(); }
  });
  ro.observe(document.getElementById("map"));
}

// Legend: status toggles, color-by picker + key, notes.
function keyHtml(mode) {
  if (mode === "ppsf") {
    if (!ppsfVals.length) return `<span class="muted">no sq ft data yet</span>`;
    return `<div class="scalebar" style="background:linear-gradient(90deg,${[...RAMP].reverse().join(",")})"></div>` +
      `<div class="scalelabels"><span>$${ppsfMin.toFixed(2)}</span>` +
      `<span>$ / sq ft</span><span>$${ppsfMax.toFixed(2)}</span></div>` +
      `<span class="dot" style="background:${NODATA}"></span>` +
      `<span class="muted">no sq ft known</span>`;
  }
  if (mode === "rank") {
    const counts = {};
    for (const m of markers) {
      const r = m.rank.trim().toLowerCase();
      counts[r] = (counts[r] || 0) + 1;
    }
    let h = "";
    for (const r of [...RANK_ORDER, "expired"])
      if (counts[r]) h += `<span class="dot" style="background:${RANK_COLORS[r]}"></span>` +
                          `${esc(r)} (${counts[r]})<br>`;
    const unranked = markers.length -
      Object.entries(counts).reduce((s, [r, n]) => s + (RANK_COLORS[r] ? n : 0), 0);
    if (unranked) h += `<span class="dot" style="background:${UNRANKED}"></span>` +
                       `<span class="muted">not ranked yet (${unranked})</span><br>`;
    return h;
  }
  return "";  // status: the filter swatches above are the key
}

function applyMode(mode, div) {
  colorMode = mode;
  store.set(mode);
  for (const [m, mk] of dots) {
    const c = dotColor(m, mode);
    mk.setStyle({ color: c, fillColor: c });
  }
  div.querySelector("#scalekey").innerHTML = keyHtml(mode);
  // In a non-status mode the dots no longer wear status colors — mute the
  // filter swatches so the only colored key on screen is the active scale.
  for (const el of div.querySelectorAll(".statusdot"))
    el.style.background = mode === "status" ? el.dataset.c : "#cbd5e0";
}

const MODE_LABELS = { status: "status", ppsf: "$ / sq ft", rank: "Carly rank" };
const legend = L.control({ position: "topright" });
legend.onAdd = () => {
  const div = L.DomUtil.create("div", "legend");
  let h = "";
  for (const [area, z] of Object.entries(zones))
    h += `<label><input type="checkbox" checked data-zone="${esc(area)}">` +

  h += `<span class="dot hollow" style="border-color:#666"></span>` +

  div.addEventListener("change", e => {
    if (e.target.name === "colormode") return applyMode(e.target.value, div);
    if (e.target.dataset.noise)
      return e.target.checked ? noiseLayer.addTo(map) : noiseLayer.remove();
    const s = byStatus[e.target.dataset.status] ?? zones[e.target.dataset.zone];
    if (s) e.target.checked ? s.group.addTo(map) : s.group.remove();
  });
  L.DomEvent.disableClickPropagation(div);
  applyMode(colorMode, div);
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
